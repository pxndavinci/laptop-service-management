name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The client in src/api must match openapi.yaml; fail if someone changed
      # the contract without regenerating (or hand-edited generated code).
      - name: Generated API client is up to date
        run: |
          npm run generate:api
          git diff --exit-code -- src/api || (echo "::error::Run 'npx orval' in frontend/ and commit src/api" && exit 1)
          test -z "$(git status --porcelain -- src/api)" || (git status --porcelain -- src/api && echo "::error::Untracked generated files — run 'npx orval' and commit" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
